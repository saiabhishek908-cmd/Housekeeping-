<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HouseKeep</title>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #f5f5f5;
}

.app {
  max-width: 480px;
  margin: auto;
  background: white;
  min-height: 100vh;
  padding: 25px;
  box-sizing: border-box;
}

h1 {
  font-size: 32px;
  margin-bottom: 5px;
}

p {
  color: #666;
}

.box {
  border: 1px solid #ddd;
  border-radius: 12px;
  padding: 15px;
  margin: 12px 0;
}

label {
  display: block;
  font-weight: bold;
  margin-bottom: 8px;
}

input,
select {
  width: 100%;
  padding: 13px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 16px;
  box-sizing: border-box;
}

button {
  width: 100%;
  padding: 15px;
  background: #111;
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 17px;
  font-weight: bold;
  margin-top: 10px;
}

.locationButton {
  background: #eee;
  color: #111;
}

#locationStatus {
  margin-top: 10px;
  font-size: 14px;
  color: #666;
}

#result {
  display: none;
  margin-top: 15px;
  padding: 15px;
  background: #e9f7e9;
  border-radius: 10px;
  font-weight: bold;
  white-space: pre-line;
}
</style>
</head>

<body>

<div class="app">

<h1>HouseKeep</h1>

<p>Book a housekeeper when you need one.</p>


<!-- ================================
     CUSTOMER DETAILS
     ================================ -->

<div class="box">

<label>Customer Name</label>

<input
  id="customerName"
  type="text"
  placeholder="Enter your name"
  autocomplete="name"
>

</div>


<div class="box">

<label>Phone Number</label>

<input
  id="customerPhone"
  type="tel"
  placeholder="Enter your phone number"
  autocomplete="tel"
  inputmode="tel"
>

</div>


<!-- ================================
     LOCATION
     ================================ -->

<div class="box">

<label>Location</label>

<input
  id="location"
  placeholder="Enter your location"
>

<button
  type="button"
  class="locationButton"
  id="locationButton"
>
📍 Use my current location
</button>

<div id="locationStatus"></div>

</div>


<!-- ================================
     SERVICE
     ================================ -->

<div class="box">

<label>Service</label>

<select id="service">

<option>Regular cleaning</option>
<option>Deep cleaning</option>
<option>Kitchen cleaning</option>
<option>Bathroom cleaning</option>

</select>

</div>


<!-- ================================
     DURATION
     ================================ -->

<div class="box">

<label>Duration</label>

<select id="hours">

<option value="1">1 hour</option>
<option value="2">2 hours</option>
<option value="3">3 hours</option>
<option value="4">4 hours</option>

</select>

</div>


<!-- ================================
     HOUSEKEEPERS
     ================================ -->

<div class="box">

<label>Housekeepers</label>

<select id="workers">

<option value="1">1 housekeeper</option>
<option value="2">2 housekeepers</option>
<option value="3">3 housekeepers</option>

</select>

</div>


<!-- ================================
     PRICE
     ================================ -->

<div class="box">

<label>Estimated Price</label>

<h2 id="price">₹500</h2>

</div>


<button id="bookButton">
Book a Housekeeper
</button>


<div id="result"></div>


<!-- ================================
     MY BOOKING
     ================================ -->

<div
  id="myBooking"
  class="box"
  style="display:none;"
>

<h2>My Booking</h2>

<p id="bookingDetails"></p>

</div>

</div>


<script>

/* ================================
   SUPABASE
   ================================ */

var SUPABASE_URL =
"https://yrbhxouodsfsxryaducn.supabase.co";

var SUPABASE_KEY =
"sb_publishable_TiNwYlPb2eHLfyhurkKLcg_0yKa6n4x";


/* ================================
   ELEMENTS
   ================================ */

var customerName =
document.getElementById("customerName");

var customerPhone =
document.getElementById("customerPhone");

var hours =
document.getElementById("hours");

var workers =
document.getElementById("workers");

var price =
document.getElementById("price");

var bookButton =
document.getElementById("bookButton");

var result =
document.getElementById("result");

var myBooking =
document.getElementById("myBooking");

var bookingDetails =
document.getElementById("bookingDetails");

var locationInput =
document.getElementById("location");

var locationButton =
document.getElementById("locationButton");

var locationStatus =
document.getElementById("locationStatus");


/* ================================
   GPS VARIABLES
   ================================ */

var latitude = null;
var longitude = null;


/* ================================
   GET CURRENT LOCATION
   ================================ */

locationButton.addEventListener(
  "click",
  function() {

    locationStatus.innerText =
      "Getting your location...";

    if (!navigator.geolocation) {

      locationStatus.innerText =
        "Location is not supported on this device.";

      return;
    }

    navigator.geolocation.getCurrentPosition(

      function(position) {

        latitude =
          position.coords.latitude;

        longitude =
          position.coords.longitude;

        locationInput.value =
          latitude + ", " + longitude;

        locationStatus.innerText =
          "Location detected successfully.";

        console.log(
          "Latitude:",
          latitude
        );

        console.log(
          "Longitude:",
          longitude
        );

      },

      function(error) {

        if (error.code === 1) {

          locationStatus.innerText =
            "Location permission was denied.";

        }
        else if (error.code === 2) {

          locationStatus.innerText =
            "Location could not be determined.";

        }
        else if (error.code === 3) {

          locationStatus.innerText =
            "Location request timed out.";

        }
        else {

          locationStatus.innerText =
            "Could not get your location.";

        }

      },

      {
        enableHighAccuracy: true,
        timeout: 10000,
        maximumAge: 0
      }

    );

  }
);


/* ================================
   PRICE
   ================================ */

function updatePrice() {

  var selectedHours =
    Number(hours.value);

  var selectedWorkers =
    Number(workers.value);

  var total =
    500 *
    selectedHours *
    selectedWorkers;

  price.innerText =
    "₹" + total;
}


hours.addEventListener(
  "change",
  updatePrice
);

workers.addEventListener(
  "change",
  updatePrice
);


/* ================================
   DISPLAY BOOKING
   ================================ */

function displayBooking(booking) {

  myBooking.style.display =
    "block";

  bookingDetails.innerText =

    "Booking ID: " +
    (booking.bookingCode || booking.id) +
    "\n" +

    "Customer: " +
    (booking.customer_name || "Not provided") +
    "\n" +

    "Phone: " +
    (booking.customer_phone || "Not provided") +
    "\n" +

    "Location: " +
    booking.location +
    "\n" +

    "Service: " +
    booking.service +
    "\n" +

    "Duration: " +
    booking.hours +
    " hour(s)\n" +

    "Housekeepers: " +
    booking.workers +
    "\n" +

    "Price: " +
    booking.price +
    "\n" +

    "Status: " +
    booking.status;

}


/* ================================
   CREATE BOOKING
   ================================ */

bookButton.addEventListener(
  "click",
  async function() {

    var bookingCode =
      "HK" + Date.now();


    /* ================================
       CUSTOMER DETAILS VALIDATION
       ================================ */

    var name =
      customerName.value.trim();

    var phone =
      customerPhone.value.trim();


    if (!name) {

      result.style.display =
        "block";

      result.innerText =
        "Please enter your name.";

      customerName.focus();

      return;
    }


    if (!phone) {

      result.style.display =
        "block";

      result.innerText =
        "Please enter your phone number.";

      customerPhone.focus();

      return;
    }


    /* ================================
       BOOKING DATA
       ================================ */

    var booking = {

      customer_name:
      name,

      customer_phone:
      phone,

      location:
      locationInput.value,

      latitude:
      latitude,

      longitude:
      longitude,

      service:
      document.getElementById(
        "service"
      ).value,

      hours:
      Number(hours.value),

      workers:
      Number(workers.value),

      price:
      price.innerText,

      status:
      "pending"
    };


    /* ================================
       CHECK LOCATION
       ================================ */

    if (
      latitude === null ||
      longitude === null
    ) {

      result.style.display =
        "block";

      result.innerText =
        "Please use your current location before booking.";

      return;
    }


    try {

      var response =
        await fetch(
          SUPABASE_URL +
          "/rest/v1/bookings",
          {

            method: "POST",

            headers: {

              "apikey":
              SUPABASE_KEY,

              "Authorization":
              "Bearer " +
              SUPABASE_KEY,

              "Content-Type":
              "application/json",

              "Prefer":
              "return=representation"
            },

            body:
            JSON.stringify(booking)
          }
        );


      if (!response.ok) {

        var errorText =
          await response.text();

        result.style.display =
          "block";

        result.innerText =
          "Booking failed:\n" +
          errorText;

        return;
      }


      var savedRows =
        await response.json();


      if (
        !savedRows ||
        savedRows.length === 0
      ) {

        result.style.display =
          "block";

        result.innerText =
          "Booking created, but ID could not be retrieved.";

        return;
      }


      booking.id =
        savedRows[0].id;

      booking.bookingCode =
        bookingCode;


      localStorage.setItem(
        "housekeepBooking",
        JSON.stringify(booking)
      );


      result.style.display =
        "block";

      result.innerText =

        "Booking confirmed!\n\n" +

        "Booking ID: " +
        bookingCode +
        "\n" +

        "Customer: " +
        booking.customer_name +
        "\n" +

        "Service: " +
        booking.service +
        "\n" +

        "Duration: " +
        booking.hours +
        " hour(s)\n" +

        "Housekeepers: " +
        booking.workers +
        "\n" +

        "Price: " +
        booking.price;


      displayBooking(
        booking
      );

    }


    catch(error) {

      result.style.display =
        "block";

      result.innerText =
        "Connection error:\n" +
        error.message;

    }

  }
);


/* ================================
   CHECK BOOKING STATUS
   ================================ */

async function checkBookingStatus() {

  var saved =
    localStorage.getItem(
      "housekeepBooking"
    );


  if (!saved) {
    return;
  }


  var booking =
    JSON.parse(saved);


  if (!booking.id) {
    return;
  }


  try {

    var response =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/bookings?id=eq." +
        booking.id +
        "&select=*",

        {

          headers: {

            "apikey":
            SUPABASE_KEY,

            "Authorization":
            "Bearer " +
            SUPABASE_KEY

          }

        }

      );


    if (!response.ok) {
      return;
    }


    var bookings =
      await response.json();


    if (
      bookings.length === 0
    ) {
      return;
    }


    booking.status =
      bookings[0].status;

    booking.location =
      bookings[0].location;

    booking.latitude =
      bookings[0].latitude;

    booking.longitude =
      bookings[0].longitude;

    booking.service =
      bookings[0].service;

    booking.hours =
      bookings[0].hours;

    booking.workers =
      bookings[0].workers;

    booking.price =
      bookings[0].price;

    booking.customer_name =
      bookings[0].customer_name;

    booking.customer_phone =
      bookings[0].customer_phone;


    localStorage.setItem(
      "housekeepBooking",
      JSON.stringify(booking)
    );


    displayBooking(
      booking
    );

  }


  catch(error) {

    console.log(
      "Status check error:",
      error
    );

  }

}


/* ================================
   LOAD EXISTING BOOKING
   ================================ */

function loadExistingBooking() {

  var saved =
    localStorage.getItem(
      "housekeepBooking"
    );


  if (!saved) {
    return;
  }


  var booking =
    JSON.parse(saved);


  displayBooking(
    booking
  );

}


/* ================================
   START
   ================================ */

updatePrice();

loadExistingBooking();

checkBookingStatus();

setInterval(
  checkBookingStatus,
  5000
);

</script>

</body>
</html>
