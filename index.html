<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HouseKeep</title>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #f5f5f5;
}

.app {
  max-width: 480px;
  margin: auto;
  background: white;
  min-height: 100vh;
  padding: 25px;
  box-sizing: border-box;
}

h1 {
  font-size: 32px;
  margin-bottom: 5px;
}

p {
  color: #666;
}

.box {
  border: 1px solid #ddd;
  border-radius: 12px;
  padding: 15px;
  margin: 12px 0;
}

label {
  display: block;
  font-weight: bold;
  margin-bottom: 8px;
}

input,
select {
  width: 100%;
  padding: 13px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 16px;
  box-sizing: border-box;
}

button {
  width: 100%;
  padding: 15px;
  background: #111;
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 17px;
  font-weight: bold;
  margin-top: 10px;
}

.locationButton {
  background: #eee;
  color: #111;
}

#locationStatus {
  margin-top: 10px;
  font-size: 14px;
  color: #666;
}

#result {
  display: none;
  margin-top: 15px;
  padding: 15px;
  background: #e9f7e9;
  border-radius: 10px;
  font-weight: bold;
  white-space: pre-line;
}

#errorResult {
  display: none;
  margin-top: 15px;
  padding: 15px;
  background: #fdecec;
  border-radius: 10px;
  font-weight: bold;
  white-space: pre-line;
}
</style>
</head>

<body>

<div class="app">

<h1>HouseKeep</h1>

<p>Book a housekeeper when you need one.</p>


<!-- ================================
     CUSTOMER DETAILS
     ================================ -->

<div class="box">

<label>Customer Name</label>

<input
  id="customerName"
  type="text"
  placeholder="Enter your name"
  autocomplete="name"
>

</div>


<div class="box">

<label>Phone Number</label>

<input
  id="customerPhone"
  type="tel"
  placeholder="Enter your phone number"
  autocomplete="tel"
  inputmode="tel"
>

</div>


<!-- ================================
     LOCATION
     ================================ -->

<div class="box">

<label>Location</label>

<input
  id="location"
  placeholder="Enter your location"
>

<button
  type="button"
  class="locationButton"
  id="locationButton"
>
📍 Use my current location
</button>

<div id="locationStatus"></div>

</div>


<!-- ================================
     SERVICE
     ================================ -->

<div class="box">

<label>Service</label>

<select id="service">

<option>Regular cleaning</option>
<option>Deep cleaning</option>
<option>Kitchen cleaning</option>
<option>Bathroom cleaning</option>

</select>

</div>


<!-- ================================
     DURATION
     ================================ -->

<div class="box">

<label>Duration</label>

<select id="hours">

<option value="1">1 hour</option>
<option value="2">2 hours</option>
<option value="3">3 hours</option>
<option value="4">4 hours</option>

</select>

</div>


<!-- ================================
     HOUSEKEEPERS
     ================================ -->

<div class="box">

<label>Housekeepers</label>

<select id="workers">

<option value="1">1 housekeeper</option>
<option value="2">2 housekeepers</option>
<option value="3">3 housekeepers</option>

</select>

</div>


<!-- ================================
     PRICE
     ================================ -->

<div class="box">

<label>Estimated Price</label>

<h2 id="price">₹500</h2>

</div>


<button id="bookButton">
Book a Housekeeper
</button>


<div id="result"></div>

<div id="errorResult"></div>


<!-- ================================
     MY BOOKING
     ================================ -->

<div
  id="myBooking"
  class="box"
  style="display:none;"
>

<h2>My Booking</h2>

<p id="bookingDetails"></p>

</div>

</div>


<script>

/* ================================
   SUPABASE
   ================================ */

var SUPABASE_URL =
"https://yrbhxouodsfsxryaducn.supabase.co";

var SUPABASE_KEY =
"sb_publishable_TiNwYlPb2eHLfyhurkKLcg_0yKa6n4x";


/* ================================
   ELEMENTS
   ================================ */

var customerName =
document.getElementById("customerName");

var customerPhone =
document.getElementById("customerPhone");

var hours =
document.getElementById("hours");

var workers =
document.getElementById("workers");

var price =
document.getElementById("price");

var bookButton =
document.getElementById("bookButton");

var result =
document.getElementById("result");

var errorResult =
document.getElementById("errorResult");

var myBooking =
document.getElementById("myBooking");

var bookingDetails =
document.getElementById("bookingDetails");

var locationInput =
document.getElementById("location");

var locationButton =
document.getElementById("locationButton");

var locationStatus =
document.getElementById("locationStatus");


/* ================================
   GPS VARIABLES
   ================================ */

var latitude = null;
var longitude = null;


/* ================================
   GET CURRENT LOCATION
   ================================ */

locationButton.addEventListener(
  "click",
  function() {

    locationStatus.innerText =
      "Getting your location...";

    if (!navigator.geolocation) {

      locationStatus.innerText =
        "Location is not supported on this device.";

      return;
    }

    navigator.geolocation.getCurrentPosition(

      function(position) {

        latitude =
          position.coords.latitude;

        longitude =
          position.coords.longitude;

        locationInput.value =
          latitude + ", " + longitude;

        locationStatus.innerText =
          "Location detected successfully.";

        console.log(
          "Latitude:",
          latitude
        );

        console.log(
          "Longitude:",
          longitude
        );

      },

      function(error) {

        if (error.code === 1) {

          locationStatus.innerText =
            "Location permission was denied.";

        }
        else if (error.code === 2) {

          locationStatus.innerText =
            "Location could not be determined.";

        }
        else if (error.code === 3) {

          locationStatus.innerText =
            "Location request timed out.";

        }
        else {

          locationStatus.innerText =
            "Could not get your location.";

        }

      },

      {
        enableHighAccuracy: true,
        timeout: 10000,
        maximumAge: 0
      }

    );

  }
);


/* ================================
   PRICE
   ================================ */

function updatePrice() {

  var selectedHours =
    Number(hours.value);

  var selectedWorkers =
    Number(workers.value);

  var total =
    500 *
    selectedHours *
    selectedWorkers;

  price.innerText =
    "₹" + total;
}


hours.addEventListener(
  "change",
  updatePrice
);

workers.addEventListener(
  "change",
  updatePrice
);


/* ================================
   DISPLAY BOOKING
   ================================ */

function displayBooking(booking) {

  myBooking.style.display =
    "block";

  bookingDetails.innerText =

    "Booking ID: " +
    (booking.bookingCode || booking.id || "Pending") +
    "\n" +

    "Customer: " +
    (booking.customer_name || "Not provided") +
    "\n" +

    "Phone: " +
    (booking.customer_phone || "Not provided") +
    "\n" +

    "Location: " +
    (booking.location || "Not provided") +
    "\n" +

    "Service: " +
    (booking.service || "Not provided") +
    "\n" +

    "Duration: " +
    (booking.hours || "Not provided") +
    " hour(s)\n" +

    "Housekeepers: " +
    (booking.workers || "Not provided") +
    "\n" +

    "Price: " +
    (booking.price || "Not provided") +
    "\n" +

    "Status: " +
    (booking.status || "pending");

}


/* ================================
   GET BOOKING USING SECURE RPC
   ================================ */

async function getBookingByToken(
  customerToken
) {

  var response =
    await fetch(

      SUPABASE_URL +
      "/rest/v1/rpc/get_booking_by_customer_token",

      {

        method: "POST",

        headers: {

          "apikey":
          SUPABASE_KEY,

          "Authorization":
          "Bearer " +
          SUPABASE_KEY,

          "Content-Type":
          "application/json"

        },

        body:
        JSON.stringify({

          p_customer_token:
          customerToken

        })

      }

    );


  if (!response.ok) {

    var errorText =
      await response.text();

    throw new Error(
      errorText
    );

  }


  var data =
    await response.json();


  if (
    !data ||
    data.length === 0
  ) {

    return null;

  }


  return data[0];

}


/* ================================
   CREATE BOOKING
   ================================ */

bookButton.addEventListener(
  "click",
  async function() {

    /* ================================
       CREATE BOOKING CODE
       ================================ */

    var bookingCode =
      "HK" + Date.now();


    /* ================================
       CREATE PRIVATE CUSTOMER TOKEN
       ================================ */

    var customerToken =
      crypto.randomUUID();


    /* ================================
       CUSTOMER DETAILS VALIDATION
       ================================ */

    var name =
      customerName.value.trim();

    var phone =
      customerPhone.value.trim();


    if (!name) {

      result.style.display =
        "block";

      errorResult.style.display =
        "none";

      result.innerText =
        "Please enter your name.";

      customerName.focus();

      return;
    }


    if (!phone) {

      result.style.display =
        "block";

      errorResult.style.display =
        "none";

      result.innerText =
        "Please enter your phone number.";

      customerPhone.focus();

      return;
    }


    /* ================================
       CHECK LOCATION
       ================================ */

    if (
      latitude === null ||
      longitude === null
    ) {

      result.style.display =
        "block";

      errorResult.style.display =
        "none";

      result.innerText =
        "Please use your current location before booking.";

      return;
    }


    /* ================================
       BOOKING DATA
       ================================ */

    var booking = {

      customer_name:
      name,

      customer_phone:
      phone,

      customer_token:
      customerToken,

      location:
      locationInput.value,

      latitude:
      latitude,

      longitude:
      longitude,

      service:
      document.getElementById(
        "service"
      ).value,

      hours:
      Number(hours.value),

      workers:
      Number(workers.value),

      price:
      price.innerText,

      status:
      "pending"

    };


    /* ================================
       BUTTON STATE
       ================================ */

    bookButton.disabled =
      true;

    bookButton.innerText =
      "Creating booking...";


    try {

      /* ================================
         INSERT BOOKING

         IMPORTANT:
         return=minimal means Supabase
         does NOT return the inserted row.

         This allows anonymous INSERT
         without giving anonymous SELECT
         access to the bookings table.
         ================================ */

      var response =
        await fetch(

          SUPABASE_URL +
          "/rest/v1/bookings",

          {

            method: "POST",

            headers: {

              "apikey":
              SUPABASE_KEY,

              "Authorization":
              "Bearer " +
              SUPABASE_KEY,

              "Content-Type":
              "application/json",

              "Prefer":
              "return=minimal"

            },

            body:
            JSON.stringify(
              booking
            )

          }

        );


      /* ================================
         HANDLE INSERT ERROR
         ================================ */

      if (!response.ok) {

        var errorText =
          await response.text();

        errorResult.style.display =
          "block";

        result.style.display =
          "none";

        errorResult.innerText =
          "Booking failed:\n" +
          errorText;

        return;

      }


      /* ================================
         INSERT SUCCESSFUL

         Now retrieve ONLY this booking
         through the secure RPC using
         the private customer token.
         ================================ */

      var savedBooking =
        await getBookingByToken(
          customerToken
        );


      if (!savedBooking) {

        errorResult.style.display =
          "block";

        result.style.display =
          "none";

        errorResult.innerText =
          "Booking was created, but the booking details could not be retrieved.";

        return;

      }


      /* ================================
         STORE DATABASE VALUES
         ================================ */

      booking.id =
        savedBooking.id;

      booking.bookingCode =
        bookingCode;


      /* ================================
         SAVE CUSTOMER BOOKING LOCALLY
         ================================ */

      localStorage.setItem(

        "housekeepBooking",

        JSON.stringify(
          booking
        )

      );


      /* ================================
         SUCCESS MESSAGE
         ================================ */

      errorResult.style.display =
        "none";

      result.style.display =
        "block";

      result.innerText =

        "Booking confirmed!\n\n" +

        "Booking ID: " +
        bookingCode +
        "\n" +

        "Customer: " +
        booking.customer_name +
        "\n" +

        "Service: " +
        booking.service +
        "\n" +

        "Duration: " +
        booking.hours +
        " hour(s)\n" +

        "Housekeepers: " +
        booking.workers +
        "\n" +

        "Price: " +
        booking.price;


      /* ================================
         DISPLAY BOOKING
         ================================ */

      displayBooking(
        booking
      );


    }


    catch(error) {

      errorResult.style.display =
        "block";

      result.style.display =
        "none";

      errorResult.innerText =
        "Connection error:\n" +
        error.message;

    }


    finally {

      bookButton.disabled =
        false;

      bookButton.innerText =
        "Book a Housekeeper";

    }

  }
);


/* ================================
   CHECK BOOKING STATUS
   ================================ */

async function checkBookingStatus() {

  var saved =
    localStorage.getItem(
      "housekeepBooking"
    );


  if (!saved) {
    return;
  }


  var booking =
    JSON.parse(saved);


  if (
    !booking.customer_token
  ) {

    return;

  }


  try {

    /* ================================
       SECURE RPC ONLY

       We DO NOT directly query:

       /rest/v1/bookings?id=...

       because anonymous SELECT is
       intentionally disabled.
       ================================ */

    var latest =
      await getBookingByToken(
        booking.customer_token
      );


    if (!latest) {
      return;
    }


    /* ================================
       UPDATE LOCAL BOOKING
       ================================ */

    booking.id =
      latest.id;

    booking.status =
      latest.status;

    booking.location =
      latest.location;

    booking.latitude =
      latest.latitude;

    booking.longitude =
      latest.longitude;

    booking.service =
      latest.service;

    booking.hours =
      latest.hours;

    booking.workers =
      latest.workers;

    booking.price =
      latest.price;

    booking.customer_name =
      latest.customer_name;

    booking.customer_phone =
      latest.customer_phone;


    localStorage.setItem(

      "housekeepBooking",

      JSON.stringify(
        booking
      )

    );


    displayBooking(
      booking
    );

  }


  catch(error) {

    console.log(
      "Status check error:",
      error
    );

  }

}


/* ================================
   LOAD EXISTING BOOKING
   ================================ */

function loadExistingBooking() {

  var saved =
    localStorage.getItem(
      "housekeepBooking"
    );


  if (!saved) {
    return;
  }


  var booking =
    JSON.parse(saved);


  displayBooking(
    booking
  );

}


/* ================================
   START
   ================================ */

updatePrice();

loadExistingBooking();

checkBookingStatus();

setInterval(
  checkBookingStatus,
  5000
);

</script>

</body>
</html>
