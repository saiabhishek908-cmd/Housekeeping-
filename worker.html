<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HouseKeep Worker</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f5f5;
    }

    .app {
      max-width: 480px;
      margin: auto;
      background: white;
      min-height: 100vh;
      padding: 25px;
      box-sizing: border-box;
    }

    h1 {
      margin-bottom: 5px;
    }

    .booking {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 18px;
      margin-top: 20px;
    }

    .status {
      font-weight: bold;
      margin-top: 15px;
      white-space: pre-line;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
      margin-top: 10px;
    }

    .accept {
      background: #111;
      color: white;
    }

    .reject {
      background: #eee;
      color: #111;
    }

    .navigate {
      background: #1a73e8;
      color: white;
      text-decoration: none;
      display: block;
      text-align: center;
      box-sizing: border-box;
    }

    .coordinates {
      margin-top: 12px;
      padding: 10px;
      background: #f5f5f5;
      border-radius: 8px;
      font-size: 14px;
      color: #555;
    }
  </style>
</head>

<body>

<div class="app">

  <h1>HouseKeep Worker</h1>
  <p>New cleaning request</p>

  <div class="booking">

    <h2>New Booking</h2>

    <div id="bookingDetails">
      Loading booking...
    </div>

    <div id="coordinates"></div>

    <a
      id="navigateButton"
      class="navigate"
      href="#"
      target="_blank"
      style="display:none;"
    >
      📍 Navigate to Customer
    </a>

    <button class="accept" onclick="acceptJob()">
      Accept Job
    </button>

    <button class="reject" onclick="rejectJob()">
      Reject
    </button>

    <div id="status" class="status"></div>

  </div>

</div>

<script>

var SUPABASE_URL =
  "https://yrbhxouodsfsxryaducn.supabase.co";

var SUPABASE_KEY =
  "sb_publishable_TiNwYlPb2eHLfyhurkKLcg_0yKa6n4x";

var currentBookingId = null;


/* ================================
   LOAD PENDING BOOKING
   ================================ */

async function loadBookings() {

  var response = await fetch(
    SUPABASE_URL +
    "/rest/v1/bookings?select=*&status=eq.pending&order=created_at.desc",
    {
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY
      }
    }
  );


  if (!response.ok) {

    document.getElementById("status").innerText =
      "Could not load bookings.";

    return;
  }


  var bookings =
    await response.json();


  if (bookings.length === 0) {

    document.getElementById("bookingDetails").innerText =
      "No new bookings.";

    document.getElementById("navigateButton").style.display =
      "none";

    return;
  }


  var booking =
    bookings[0];


  currentBookingId =
    booking.id;


  /* ================================
     BOOKING DETAILS
     ================================ */

  document.getElementById(
    "bookingDetails"
  ).innerHTML =

    "<strong>Location:</strong> " +
    booking.location +
    "<br>" +

    "<strong>Service:</strong> " +
    booking.service +
    "<br>" +

    "<strong>Duration:</strong> " +
    booking.hours +
    " hour(s)<br>" +

    "<strong>Housekeepers:</strong> " +
    booking.workers +
    "<br>" +

    "<strong>Price:</strong> " +
    booking.price;


  /* ================================
     GPS LOCATION
     ================================ */

  if (
    booking.latitude !== null &&
    booking.longitude !== null
  ) {

    document.getElementById(
      "coordinates"
    ).innerHTML =

      "<div class='coordinates'>" +

      "<strong>Customer GPS:</strong><br>" +

      booking.latitude +
      ", " +
      booking.longitude +

      "</div>";


    /* ================================
       GOOGLE MAPS NAVIGATION
       ================================ */

    var mapsUrl =
      "https://www.google.com/maps/dir/?api=1&destination=" +
      booking.latitude +
      "," +
      booking.longitude;


    var navigateButton =
      document.getElementById(
        "navigateButton"
      );


    navigateButton.href =
      mapsUrl;


    navigateButton.style.display =
      "block";

  }
  else {

    document.getElementById(
      "coordinates"
    ).innerHTML =

      "<div class='coordinates'>" +
      "Customer GPS location not available." +
      "</div>";

    document.getElementById(
      "navigateButton"
    ).style.display =
      "none";
  }

}


/* ================================
   ACCEPT JOB
   ================================ */

async function acceptJob() {

  if (!currentBookingId) {

    document.getElementById("status").innerText =
      "No booking selected.";

    return;
  }


  var response = await fetch(

    SUPABASE_URL +
    "/rest/v1/bookings?id=eq." +
    currentBookingId,

    {

      method: "PATCH",

      headers: {

        "apikey":
        SUPABASE_KEY,

        "Authorization":
        "Bearer " +
        SUPABASE_KEY,

        "Content-Type":
        "application/json",

        "Prefer":
        "return=minimal"

      },

      body: JSON.stringify({

        status:
        "accepted"

      })

    }

  );


  if (!response.ok) {

    var errorText =
      await response.text();

    document.getElementById(
      "status"
    ).innerText =

      "Could not accept booking:\n" +
      errorText;

    return;
  }


  document.getElementById(
    "status"
  ).innerText =

    "Job accepted!\n" +
    "Use Navigate to reach the customer.";

}


/* ================================
   REJECT JOB
   ================================ */

async function rejectJob() {

  if (!currentBookingId) {

    document.getElementById("status").innerText =
      "No booking selected.";

    return;
  }


  var response = await fetch(

    SUPABASE_URL +
    "/rest/v1/bookings?id=eq." +
    currentBookingId,

    {

      method: "PATCH",

      headers: {

        "apikey":
        SUPABASE_KEY,

        "Authorization":
        "Bearer " +
        SUPABASE_KEY,

        "Content-Type":
        "application/json",

        "Prefer":
        "return=minimal"

      },

      body: JSON.stringify({

        status:
        "rejected"

      })

    }

  );


  if (!response.ok) {

    document.getElementById(
      "status"
    ).innerText =

      "Could not reject booking.";

    return;
  }


  document.getElementById(
    "status"
  ).innerText =

    "Job rejected.";

}


/* ================================
   START
   ================================ */

loadBookings();

</script>

</body>
</html>
