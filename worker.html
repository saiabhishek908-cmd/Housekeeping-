<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>HouseKeep Worker</title>

  <!-- Supabase JavaScript client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f5f5;
    }

    .app {
      max-width: 480px;
      margin: auto;
      background: white;
      min-height: 100vh;
      padding: 25px;
      box-sizing: border-box;
    }

    h1 {
      margin-bottom: 5px;
    }

    h2 {
      margin-top: 0;
    }

    p {
      color: #666;
    }

    .loginBox {
      padding: 20px;
      background: #f5f5f5;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .loginInput {
      width: 100%;
      padding: 14px;
      box-sizing: border-box;
      margin-top: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    .loginButton {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      background: #111;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .loginButton:disabled {
      opacity: 0.6;
    }

    .logoutButton {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      background: #eee;
      color: #111;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .loginStatus {
      margin-top: 10px;
      color: #666;
      white-space: pre-line;
      font-size: 14px;
    }

    .workerInfo {
      display: none;
      padding: 12px;
      background: #eef5ff;
      border-radius: 10px;
      margin-bottom: 15px;
      font-size: 14px;
      color: #333;
    }

    .booking {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 18px;
      margin-top: 20px;
    }

    .new-job {
      background: #e8f5e9;
      border: 1px solid #b7dfb9;
      color: #1b5e20;
      padding: 12px;
      border-radius: 10px;
      font-weight: bold;
      margin-bottom: 15px;
      display: none;
    }

    .price {
      font-size: 22px;
      font-weight: bold;
      margin-top: 10px;
    }

    .status {
      font-weight: bold;
      margin-top: 15px;
      white-space: pre-line;
    }

    button,
    .navigate,
    .contactButton {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
      margin-top: 10px;
      box-sizing: border-box;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .accept {
      background: #111;
      color: white;
    }

    .reject {
      background: #eee;
      color: #111;
    }

    .navigate {
      background: #1a73e8;
      color: white;
      text-decoration: none;
      display: none;
      text-align: center;
    }

    .contactSection {
      display: none;
      margin-top: 15px;
      padding: 15px;
      background: #f5f5f5;
      border-radius: 10px;
    }

    .contactTitle {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .contactInfo {
      font-size: 15px;
      line-height: 1.6;
      color: #333;
    }

    .callButton {
      background: #168a3a;
      color: white;
      text-decoration: none;
      display: block;
      text-align: center;
    }

    .whatsappButton {
      background: #25d366;
      color: white;
      text-decoration: none;
      display: block;
      text-align: center;
    }

    .coordinates {
      margin-top: 12px;
      padding: 12px;
      background: #f5f5f5;
      border-radius: 8px;
      font-size: 14px;
      color: #555;
    }

    .loading {
      color: #666;
    }

    .waiting {
      padding: 15px;
      background: #f5f5f5;
      border-radius: 10px;
      margin-top: 20px;
      text-align: center;
      color: #666;
    }

    .hidden {
      display: none !important;
    }

  </style>
</head>

<body>

<div class="app">

  <h1>HouseKeep Worker</h1>

  <p>Worker dashboard</p>


  <!-- =================================
       WORKER LOGIN
       ================================= -->

  <div
    id="loginBox"
    class="loginBox"
  >

    <h2>🔐 Worker Login</h2>

    <input
      id="workerEmail"
      class="loginInput"
      type="email"
      placeholder="Worker email"
      autocomplete="username"
    >

    <input
      id="workerPassword"
      class="loginInput"
      type="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button
      id="loginButton"
      class="loginButton"
      onclick="loginWorker()"
    >
      🔐 Login
    </button>

    <div
      id="loginStatus"
      class="loginStatus"
    ></div>

  </div>


  <!-- =================================
       LOGGED-IN WORKER INFO
       ================================= -->

  <div
    id="workerInfo"
    class="workerInfo"
  >

    <strong>Logged in as:</strong>
    <span id="workerEmailDisplay"></span>

    <br>

    <strong>Worker ID:</strong>
    <span id="workerIdDisplay"></span>

    <button
      class="logoutButton"
      onclick="logoutWorker()"
    >
      Logout
    </button>

  </div>


  <!-- =================================
       WORKER APP
       ================================= -->

  <div
    id="workerApp"
    class="hidden"
  >

    <p>Available cleaning requests</p>

    <div
      id="waitingMessage"
      class="waiting"
    >
      Checking for new bookings...
    </div>


    <div class="booking">

      <div
        id="newJobAlert"
        class="new-job"
      >
        🔔 New cleaning request available!
      </div>

      <h2>New Booking</h2>

      <div
        id="bookingDetails"
        class="loading"
      >
        Loading booking...
      </div>

      <div id="coordinates"></div>


      <!-- =================================
           NAVIGATION
           ================================= -->

      <a
        id="navigateButton"
        class="navigate"
        href="#"
        target="_blank"
      >
        📍 Navigate to Customer
      </a>


      <!-- =================================
           CUSTOMER CONTACT
           Hidden until acceptance
           ================================= -->

      <div
        id="contactSection"
        class="contactSection"
      >

        <div class="contactTitle">
          👤 Customer Contact
        </div>

        <div
          id="contactInfo"
          class="contactInfo"
        ></div>

        <a
          id="callButton"
          class="contactButton callButton"
          href="#"
        >
          📞 Call Customer
        </a>

        <a
          id="whatsappButton"
          class="contactButton whatsappButton"
          href="#"
          target="_blank"
        >
          💬 WhatsApp Customer
        </a>

      </div>


      <!-- =================================
           ACCEPT / REJECT
           ================================= -->

      <button
        id="acceptButton"
        class="accept"
        onclick="acceptJob()"
        style="display: none;"
      >
        ✅ Accept Job
      </button>

      <button
        id="rejectButton"
        class="reject"
        onclick="rejectJob()"
        style="display: none;"
      >
        ❌ Reject
      </button>


      <div
        id="status"
        class="status"
      ></div>

    </div>

  </div>

</div>


<script>

/* =================================
   SUPABASE CONFIG
   ================================= */

var SUPABASE_URL =
  "https://yrbhxouodsfsxryaducn.supabase.co";

var SUPABASE_KEY =
  "sb_publishable_TiNwYlPb2eHLfyhurkKLcg_0yKa6n4x";


/* =================================
   SUPABASE CLIENT
   ================================= */

var supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =================================
   AUTH STATE
   ================================= */

var currentUser = null;

var currentSession = null;


/* =================================
   CURRENT BOOKING
   ================================= */

var currentBookingId = null;

var currentBooking = null;

var lastSeenBookingId = null;

var workerBusy = false;


/* =================================
   ELEMENTS
   ================================= */

var loginBox =
  document.getElementById("loginBox");

var workerInfo =
  document.getElementById("workerInfo");

var workerApp =
  document.getElementById("workerApp");

var workerEmail =
  document.getElementById("workerEmail");

var workerPassword =
  document.getElementById("workerPassword");

var loginButton =
  document.getElementById("loginButton");

var loginStatus =
  document.getElementById("loginStatus");

var workerEmailDisplay =
  document.getElementById(
    "workerEmailDisplay"
  );

var workerIdDisplay =
  document.getElementById(
    "workerIdDisplay"
  );

var bookingDetails =
  document.getElementById(
    "bookingDetails"
  );

var coordinates =
  document.getElementById(
    "coordinates"
  );

var navigateButton =
  document.getElementById(
    "navigateButton"
  );

var acceptButton =
  document.getElementById(
    "acceptButton"
  );

var rejectButton =
  document.getElementById(
    "rejectButton"
  );

var status =
  document.getElementById(
    "status"
  );

var newJobAlert =
  document.getElementById(
    "newJobAlert"
  );

var waitingMessage =
  document.getElementById(
    "waitingMessage"
  );

var contactSection =
  document.getElementById(
    "contactSection"
  );

var contactInfo =
  document.getElementById(
    "contactInfo"
  );

var callButton =
  document.getElementById(
    "callButton"
  );

var whatsappButton =
  document.getElementById(
    "whatsappButton"
  );


/* =================================
   LOGIN
   ================================= */

async function loginWorker() {

  var email =
    workerEmail.value.trim();

  var password =
    workerPassword.value;


  if (!email || !password) {

    loginStatus.innerText =
      "Please enter email and password.";

    return;
  }


  loginButton.disabled = true;

  loginStatus.innerText =
    "Logging in...";


  try {

    var result =
      await supabaseClient.auth.signInWithPassword({

        email: email,

        password: password

      });


    if (result.error) {

      loginStatus.innerText =
        "Login failed:\n" +
        result.error.message;

      loginButton.disabled = false;

      return;
    }


    currentSession =
      result.data.session;

    currentUser =
      result.data.user;


    showLoggedInWorker();

  }

  catch(error) {

    loginStatus.innerText =
      "Login error:\n" +
      error.message;

    loginButton.disabled = false;
  }

}


/* =================================
   SHOW LOGGED-IN WORKER
   ================================= */

function showLoggedInWorker() {

  if (!currentUser) {
    return;
  }


  loginBox.style.display = "none";

  workerInfo.style.display = "block";

  workerApp.classList.remove("hidden");


  workerEmailDisplay.innerText =
    currentUser.email || "";

  workerIdDisplay.innerText =
    currentUser.id;


  loginStatus.innerText = "";

  loginButton.disabled = false;


  loadBookings();

}


/* =================================
   LOGOUT
   ================================= */

async function logoutWorker() {

  try {

    await supabaseClient.auth.signOut();

  }

  catch(error) {

    console.log(
      "Logout error:",
      error
    );

  }


  currentUser = null;

  currentSession = null;

  workerBusy = false;

  currentBooking = null;

  currentBookingId = null;


  workerInfo.style.display = "none";

  workerApp.classList.add("hidden");

  loginBox.style.display = "block";


  workerPassword.value = "";

  loginStatus.innerText = "Logged out.";

  hideJob();

}


/* =================================
   AUTH TOKEN
   ================================= */

async function getAccessToken() {

  var result =
    await supabaseClient.auth.getSession();


  if (result.error) {
    throw result.error;
  }


  var session =
    result.data.session;


  if (!session) {

    throw new Error(
      "Worker session expired. Please login again."
    );

  }


  currentSession = session;

  currentUser = session.user;


  return session.access_token;

}


/* =================================
   HIDE JOB
   ================================= */

function hideJob() {

  bookingDetails.innerText =
    "No new bookings.";

  coordinates.innerHTML = "";

  navigateButton.style.display = "none";

  acceptButton.style.display = "none";

  rejectButton.style.display = "none";

  newJobAlert.style.display = "none";

  contactSection.style.display = "none";

  contactInfo.innerHTML = "";

  callButton.href = "#";

  whatsappButton.href = "#";

  waitingMessage.style.display = "block";

}


/* =================================
   HIDE CUSTOMER CONTACT
   ================================= */

function hideCustomerContact() {

  contactSection.style.display = "none";

  contactInfo.innerHTML = "";

  callButton.href = "#";

  whatsappButton.href = "#";

}


/* =================================
   SHOW CUSTOMER CONTACT
   ================================= */

function showCustomerContact(
  booking
) {

  var customerName =
    booking.customer_name ||
    "Customer";

  var customerPhone =
    booking.customer_phone ||
    "";


  if (!customerPhone) {

    contactSection.style.display =
      "block";

    contactInfo.innerHTML =
      "<strong>Name:</strong> " +
      customerName +
      "<br><br>" +
      "Phone number not available.";

    callButton.style.display = "none";

    whatsappButton.style.display = "none";

    return;
  }


  contactSection.style.display =
    "block";


  contactInfo.innerHTML =
    "<strong>Name:</strong> " +
    customerName +
    "<br>" +
    "<strong>Phone:</strong> " +
    customerPhone;


  callButton.href =
    "tel:" + customerPhone;

  callButton.style.display = "block";


  var whatsappNumber =
    customerPhone.replace(
      /[^0-9]/g,
      ""
    );


  if (
    whatsappNumber.length === 10
  ) {

    whatsappNumber =
      "91" +
      whatsappNumber;

  }


  whatsappButton.href =
    "https://wa.me/" +
    whatsappNumber;

  whatsappButton.style.display =
    "block";

}


/* =================================
   NEW BOOKING ALERT
   ================================= */

function alertNewBooking(
  booking
) {

  newJobAlert.style.display =
    "block";


  if ("vibrate" in navigator) {

    try {

      navigator.vibrate([
        500,
        200,
        500
      ]);

    }

    catch(error) {

      console.log(
        "Vibration unavailable:",
        error
      );

    }

  }


  if (
    "Notification" in window &&
    Notification.permission === "granted"
  ) {

    try {

      new Notification(
        "HouseKeep - New Cleaning Request",
        {
          body:
            booking.service +
            " • " +
            booking.hours +
            " hour(s) • " +
            booking.price
        }
      );

    }

    catch(error) {

      console.log(
        "Notification error:",
        error
      );

    }

  }

}


/* =================================
   SHOW JOB
   ================================= */

function showJob(
  booking
) {

  currentBooking = booking;

  currentBookingId = booking.id;


  waitingMessage.style.display =
    "none";


  if (
    lastSeenBookingId !== booking.id &&
    !workerBusy
  ) {

    lastSeenBookingId =
      booking.id;

    alertNewBooking(booking);

  }


  bookingDetails.innerHTML =

    "<strong>Location:</strong> " +
    booking.location +
    "<br><br>" +

    "<strong>Service:</strong> " +
    booking.service +
    "<br><br>" +

    "<strong>Duration:</strong> " +
    booking.hours +
    " hour(s)" +
    "<br><br>" +

    "<strong>Housekeepers:</strong> " +
    booking.workers +
    "<br><br>" +

    "<div class='price'>" +
    "💰 " +
    booking.price +
    "</div>";


  /*
    Customer contact is deliberately
    NOT requested before acceptance.
  */

  hideCustomerContact();


  var hasLatitude =
    booking.latitude !== null &&
    booking.latitude !== undefined &&
    booking.latitude !== "";

  var hasLongitude =
    booking.longitude !== null &&
    booking.longitude !== undefined &&
    booking.longitude !== "";


  if (
    hasLatitude &&
    hasLongitude
  ) {

    coordinates.innerHTML =

      "<div class='coordinates'>" +

      "<strong>Customer GPS:</strong><br>" +

      booking.latitude +
      ", " +
      booking.longitude +

      "</div>";


    var mapsUrl =
      "https://www.google.com/maps/dir/?api=1&destination=" +
      encodeURIComponent(
        booking.latitude +
        "," +
        booking.longitude
      );


    navigateButton.href = mapsUrl;

    navigateButton.style.display = "block";

  }

  else {

    coordinates.innerHTML =

      "<div class='coordinates'>" +
      "Customer GPS location not available." +
      "</div>";

    navigateButton.style.display =
      "none";

  }


  acceptButton.style.display = "block";

  rejectButton.style.display = "block";

}


/* =================================
   LOAD PENDING BOOKING
   ================================= */

async function loadBookings() {

  if (workerBusy) {
    return;
  }

  if (!currentUser) {
    return;
  }


  try {

    var token =
      await getAccessToken();


    /*
      Before acceptance:
      only basic job information is requested.
    */

    var response =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/bookings" +

        "?select=id,location,service,hours,workers,price,status,latitude,longitude,worker_id,accepted_at,created_at" +

        "&status=eq.pending" +

        "&worker_id=is.null" +

        "&order=created_at.desc",

        {

          headers: {

            "apikey": SUPABASE_KEY,

            "Authorization":
              "Bearer " + token

          }

        }

      );


    if (!response.ok) {

      var errorText =
        await response.text();

      bookingDetails.innerText =
        "Could not load bookings.";

      status.innerText =
        errorText;

      return;
    }


    var bookings =
      await response.json();


    if (
      !bookings ||
      bookings.length === 0
    ) {

      hideJob();

      return;
    }


    var booking =
      bookings[0];


    console.log(
      "WORKER BOOKING:",
      booking
    );


    showJob(booking);

  }

  catch(error) {

    bookingDetails.innerText =
      "Connection error.";

    status.innerText =
      error.message;

  }

}


/* =================================
   ACCEPT JOB
   ================================= */

async function acceptJob() {

  if (!currentBookingId) {

    status.innerText =
      "No booking selected.";

    return;
  }


  if (!currentUser) {

    status.innerText =
      "Please login again.";

    return;
  }


  workerBusy = true;

  acceptButton.disabled = true;

  rejectButton.disabled = true;

  status.innerText =
    "⏳ Accepting job...";


  try {

    var token =
      await getAccessToken();


    var response =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/bookings?id=eq." +
        currentBookingId +
        "&worker_id=is.null",

        {

          method: "PATCH",

          headers: {

            "apikey": SUPABASE_KEY,

            "Authorization":
              "Bearer " + token,

            "Content-Type":
              "application/json",

            /*
              Ask Supabase to return
              the updated row.
            */

            "Prefer":
              "return=representation"

          },

          body:
            JSON.stringify({

              status:
                "accepted",

              worker_id:
                currentUser.id,

              accepted_at:
                new Date().toISOString()

            })

        }

      );


    var responseText =
      await response.text();


    if (!response.ok) {

      workerBusy = false;

      acceptButton.disabled = false;

      rejectButton.disabled = false;

      status.innerText =
        "❌ Accept failed:\n" +
        responseText;

      return;
    }


    var updatedRows = [];


    if (responseText) {

      try {

        updatedRows =
          JSON.parse(responseText);

      }

      catch(error) {

        updatedRows = [];

      }

    }


    /*
      If RLS blocked the update,
      Supabase may return an empty array.
    */

    if (
      !updatedRows ||
      updatedRows.length === 0
    ) {

      workerBusy = false;

      acceptButton.disabled = false;

      rejectButton.disabled = false;

      status.innerText =
        "❌ Job was NOT accepted.\n\n" +
        "Supabase did not update the booking.\n" +
        "The worker UPDATE policy may not be matching.";

      return;
    }


    /*
      Local state
    */

    currentBooking.status =
      "accepted";

    currentBooking.worker_id =
      currentUser.id;

    currentBooking.accepted_at =
      new Date().toISOString();


    newJobAlert.style.display =
      "none";

    acceptButton.style.display =
      "none";

    rejectButton.style.display =
      "none";


    status.innerText =
      "✅ Job accepted!\n\n" +
      "Loading customer details...";


    /*
      Load customer contact only
      AFTER successful acceptance.
    */

    var contactResponse =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/bookings" +

        "?select=customer_name,customer_phone" +

        "&id=eq." +
        currentBookingId +

        "&worker_id=eq." +
        currentUser.id,

        {

          headers: {

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              token

          }

        }

      );


    if (contactResponse.ok) {

      var contactRows =
        await contactResponse.json();


      if (
        contactRows &&
        contactRows.length > 0
      ) {

        currentBooking.customer_name =
          contactRows[0].customer_name;

        currentBooking.customer_phone =
          contactRows[0].customer_phone;


        showCustomerContact(
          currentBooking
        );


        status.innerText =
          "✅ Job accepted!\n\n" +
          "Customer details unlocked.";

      }

      else {

        status.innerText =
          "✅ Job accepted!\n\n" +
          "Customer contact is not available.";

      }

    }

    else {

      status.innerText =
        "✅ Job accepted!\n\n" +
        "Customer contact could not be loaded.";

    }


    if (
      currentBooking &&
      currentBooking.latitude !== null &&
      currentBooking.latitude !== undefined &&
      currentBooking.latitude !== "" &&
      currentBooking.longitude !== null &&
      currentBooking.longitude !== undefined &&
      currentBooking.longitude !== ""
    ) {

      navigateButton.style.display =
        "block";

    }

  }

  catch(error) {

    workerBusy = false;

    acceptButton.disabled = false;

    rejectButton.disabled = false;

    status.innerText =
      "❌ Accept error:\n" +
      error.message;

  }

}


/* =================================
   REJECT JOB
   ================================= */

async function rejectJob() {

  if (!currentBookingId) {

    status.innerText =
      "No booking selected.";

    return;
  }


  if (!currentUser) {

    status.innerText =
      "Please login again.";

    return;
  }


  acceptButton.disabled = true;

  rejectButton.disabled = true;

  status.innerText =
    "⏳ Rejecting job...";


  try {

    var token =
      await getAccessToken();


    var response =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/bookings?id=eq." +
        currentBookingId +
        "&worker_id=is.null",

        {

          method: "PATCH",

          headers: {

            "apikey": SUPABASE_KEY,

            "Authorization":
              "Bearer " + token,

            "Content-Type":
              "application/json",

            "Prefer":
              "return=representation"

          },

          body:
            JSON.stringify({

              status:
                "rejected"

            })

        }

      );


    var responseText =
      await response.text();


    if (!response.ok) {

      acceptButton.disabled = false;

      rejectButton.disabled = false;

      status.innerText =
        "❌ Reject failed:\n" +
        responseText;

      return;
    }


    var updatedRows = [];


    if (responseText) {

      try {

        updatedRows =
          JSON.parse(responseText);

      }

      catch(error) {

        updatedRows = [];

      }

    }


    if (
      !updatedRows ||
      updatedRows.length === 0
    ) {

      acceptButton.disabled = false;

      rejectButton.disabled = false;

      status.innerText =
        "❌ Job was NOT rejected.\n\n" +
        "Supabase did not update the booking.\n" +
        "The worker UPDATE policy may not be matching.";

      return;
    }


    currentBookingId = null;

    currentBooking = null;

    workerBusy = false;


    newJobAlert.style.display =
      "none";

    navigateButton.style.display =
      "none";

    acceptButton.style.display =
      "none";

    rejectButton.style.display =
      "none";


    hideCustomerContact();


    waitingMessage.style.display =
      "block";


    acceptButton.disabled = false;

    rejectButton.disabled = false;


    status.innerText =
      "❌ Job rejected.\n\n" +
      "Waiting for another request...";


    setTimeout(
      loadBookings,
      500
    );

  }

  catch(error) {

    acceptButton.disabled = false;

    rejectButton.disabled = false;

    status.innerText =
      "❌ Reject error:\n" +
      error.message;

  }

}


/* =================================
   NOTIFICATION PERMISSION
   ================================= */

async function requestNotificationPermission() {

  if (
    "Notification" in window &&
    Notification.permission === "default"
  ) {

    try {

      await Notification.requestPermission();

    }

    catch(error) {

      console.log(
        "Notification permission error:",
        error
      );

    }

  }

}


/* =================================
   AUTH STATE LISTENER
   ================================= */

supabaseClient.auth.onAuthStateChange(
  function(event, session) {

    currentSession = session;

    currentUser =
      session
        ? session.user
        : null;


    if (currentUser) {

      showLoggedInWorker();

    }

  }
);


/* =================================
   START
   ================================= */

async function startWorkerApp() {

  try {

    var result =
      await supabaseClient.auth.getSession();


    if (
      result.data &&
      result.data.session
    ) {

      currentSession =
        result.data.session;

      currentUser =
        result.data.session.user;


      showLoggedInWorker();

    }

    else {

      loginBox.style.display =
        "block";

      workerInfo.style.display =
        "none";

      workerApp.classList.add(
        "hidden"
      );

    }

  }

  catch(error) {

    console.log(
      "Session check error:",
      error
    );

  }

}


/* =================================
   START APP
   ================================= */

requestNotificationPermission();

startWorkerApp();


/* =================================
   CHECK FOR NEW BOOKINGS
   EVERY 5 SECONDS
   ================================= */

setInterval(
  loadBookings,
  5000
);

</script>
