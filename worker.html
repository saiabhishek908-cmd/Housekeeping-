<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HouseKeep Worker</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f5f5;
    }

    .app {
      max-width: 480px;
      margin: auto;
      background: white;
      min-height: 100vh;
      padding: 25px;
      box-sizing: border-box;
    }

    h1 {
      margin-bottom: 5px;
    }

    p {
      color: #666;
    }

    .booking {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 18px;
      margin-top: 20px;
    }

    .new-job {
      background: #e8f5e9;
      border: 1px solid #b7dfb9;
      color: #1b5e20;
      padding: 12px;
      border-radius: 10px;
      font-weight: bold;
      margin-bottom: 15px;
      display: none;
    }

    .price {
      font-size: 22px;
      font-weight: bold;
      margin-top: 10px;
    }

    .status {
      font-weight: bold;
      margin-top: 15px;
      white-space: pre-line;
    }

    button,
    .navigate {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
      margin-top: 10px;
      box-sizing: border-box;
    }

    button {
      cursor: pointer;
    }

    .accept {
      background: #111;
      color: white;
    }

    .reject {
      background: #eee;
      color: #111;
    }

    .navigate {
      background: #1a73e8;
      color: white;
      text-decoration: none;
      display: none;
      text-align: center;
    }

    .coordinates {
      margin-top: 12px;
      padding: 12px;
      background: #f5f5f5;
      border-radius: 8px;
      font-size: 14px;
      color: #555;
    }

    .loading {
      color: #666;
    }

    .waiting {
      padding: 15px;
      background: #f5f5f5;
      border-radius: 10px;
      margin-top: 20px;
      text-align: center;
      color: #666;
    }
  </style>
</head>

<body>

<div class="app">

  <h1>HouseKeep Worker</h1>

  <p>Available cleaning requests</p>

  <div id="waitingMessage" class="waiting">
    Checking for new bookings...
  </div>

  <div class="booking">

    <div id="newJobAlert" class="new-job">
      🔔 New cleaning request available!
    </div>

    <h2>New Booking</h2>

    <div id="bookingDetails" class="loading">
      Loading booking...
    </div>

    <div id="coordinates"></div>

    <a
      id="navigateButton"
      class="navigate"
      href="#"
      target="_blank"
    >
      📍 Navigate to Customer
    </a>

    <button
      id="acceptButton"
      class="accept"
      onclick="acceptJob()"
      style="display: none;"
    >
      ✅ Accept Job
    </button>

    <button
      id="rejectButton"
      class="reject"
      onclick="rejectJob()"
      style="display: none;"
    >
      ❌ Reject
    </button>

    <div
      id="status"
      class="status"
    ></div>

  </div>

</div>


<script>

/* =================================
   SUPABASE
   ================================= */

var SUPABASE_URL =
  "https://yrbhxouodsfsxryaducn.supabase.co";

var SUPABASE_KEY =
  "sb_publishable_TiNwYlPb2eHLfyhurkKLcg_0yKa6n4x";


/* =================================
   CURRENT BOOKING
   ================================= */

var currentBookingId = null;

var currentBooking = null;

var lastSeenBookingId = null;

var workerBusy = false;


/* =================================
   ELEMENTS
   ================================= */

var bookingDetails =
  document.getElementById("bookingDetails");

var coordinates =
  document.getElementById("coordinates");

var navigateButton =
  document.getElementById("navigateButton");

var acceptButton =
  document.getElementById("acceptButton");

var rejectButton =
  document.getElementById("rejectButton");

var status =
  document.getElementById("status");

var newJobAlert =
  document.getElementById("newJobAlert");

var waitingMessage =
  document.getElementById("waitingMessage");


/* =================================
   HIDE JOB
   ================================= */

function hideJob() {

  bookingDetails.innerText =
    "No new bookings.";

  coordinates.innerHTML =
    "";

  navigateButton.style.display =
    "none";

  acceptButton.style.display =
    "none";

  rejectButton.style.display =
    "none";

  newJobAlert.style.display =
    "none";

  waitingMessage.style.display =
    "block";

}


/* =================================
   NEW BOOKING ALERT
   ================================= */

function alertNewBooking(booking) {

  /* Visual alert */

  newJobAlert.style.display =
    "block";


  /* =================================
     PHONE VIBRATION
     ================================= */

  if (
    "vibrate" in navigator
  ) {

    try {

      navigator.vibrate([
        500,
        200,
        500
      ]);

    }

    catch(error) {

      console.log(
        "Vibration unavailable:",
        error
      );

    }

  }


  /* =================================
     BROWSER NOTIFICATION
     ================================= */

  if (
    "Notification" in window &&
    Notification.permission === "granted"
  ) {

    try {

      new Notification(
        "HouseKeep - New Cleaning Request",
        {
          body:
            booking.service +
            " • " +
            booking.hours +
            " hour(s) • " +
            booking.price
        }
      );

    }

    catch(error) {

      console.log(
        "Notification error:",
        error
      );

    }

  }

}


/* =================================
   SHOW JOB
   ================================= */

function showJob(booking) {

  currentBooking =
    booking;

  currentBookingId =
    booking.id;


  waitingMessage.style.display =
    "none";


  /* =================================
     NEW BOOKING DETECTION
     ================================= */

  if (
    lastSeenBookingId !== booking.id &&
    !workerBusy
  ) {

    lastSeenBookingId =
      booking.id;

    alertNewBooking(booking);

  }


  /* =================================
     BOOKING DETAILS
     ================================= */

  bookingDetails.innerHTML =

    "<strong>Location:</strong> " +
    booking.location +
    "<br><br>" +

    "<strong>Service:</strong> " +
    booking.service +
    "<br><br>" +

    "<strong>Duration:</strong> " +
    booking.hours +
    " hour(s)" +
    "<br><br>" +

    "<strong>Housekeepers:</strong> " +
    booking.workers +
    "<br><br>" +

    "<div class='price'>" +
    "💰 " +
    booking.price +
    "</div>";


  /* =================================
     GPS CHECK
     ================================= */

  var hasLatitude =
    booking.latitude !== null &&
    booking.latitude !== undefined &&
    booking.latitude !== "";


  var hasLongitude =
    booking.longitude !== null &&
    booking.longitude !== undefined &&
    booking.longitude !== "";


  if (
    hasLatitude &&
    hasLongitude
  ) {

    /* =================================
       SHOW GPS
       ================================= */

    coordinates.innerHTML =

      "<div class='coordinates'>" +

      "<strong>Customer GPS:</strong><br>" +

      booking.latitude +
      ", " +
      booking.longitude +

      "</div>";


    /* =================================
       GOOGLE MAPS
       ================================= */

    var mapsUrl =

      "https://www.google.com/maps/dir/?api=1&destination=" +

      encodeURIComponent(
        booking.latitude +
        "," +
        booking.longitude
      );


    navigateButton.href =
      mapsUrl;


    navigateButton.style.display =
      "block";

  }

  else {

    coordinates.innerHTML =

      "<div class='coordinates'>" +

      "Customer GPS location not available." +

      "</div>";


    navigateButton.style.display =
      "none";

  }


  /* =================================
     ACCEPT / REJECT
     ================================= */

  acceptButton.style.display =
    "block";

  rejectButton.style.display =
    "block";

}


/* =================================
   LOAD PENDING BOOKING
   ================================= */

async function loadBookings() {

  /* Don't look for another job
     after worker accepts one */

  if (workerBusy) {

    return;

  }


  try {

    var response =
      await fetch(

        SUPABASE_URL +

        "/rest/v1/bookings" +

        "?select=id,location,service,hours,workers,price,status,latitude,longitude,created_at" +

        "&status=eq.pending" +

        "&order=created_at.desc",

        {

          headers: {

            "apikey":
            SUPABASE_KEY,

            "Authorization":
            "Bearer " +
            SUPABASE_KEY

          }

        }

      );


    /* =================================
       RESPONSE ERROR
       ================================= */

    if (!response.ok) {

      var errorText =
        await response.text();

      bookingDetails.innerText =
        "Could not load bookings.";

      status.innerText =
        errorText;

      return;

    }


    /* =================================
       GET BOOKINGS
       ================================= */

    var bookings =
      await response.json();


    /* =================================
       NO BOOKINGS
       ================================= */

    if (
      !bookings ||
      bookings.length === 0
    ) {

      hideJob();

      return;

    }


    /* =================================
       NEWEST PENDING BOOKING
       ================================= */

    var booking =
      bookings[0];


    console.log(
      "WORKER BOOKING:",
      booking
    );

    console.log(
      "LATITUDE:",
      booking.latitude
    );

    console.log(
      "LONGITUDE:",
      booking.longitude
    );


    showJob(booking);

  }


  catch(error) {

    bookingDetails.innerText =
      "Connection error.";

    status.innerText =
      error.message;

  }

}


/* =================================
   ACCEPT JOB
   ================================= */

async function acceptJob() {

  if (!currentBookingId) {

    status.innerText =
      "No booking selected.";

    return;

  }


  /* =================================
     WORKER BECOMES BUSY
     ================================= */

  workerBusy =
    true;


  acceptButton.disabled =
    true;

  rejectButton.disabled =
    true;


  try {

    var response =
      await fetch(

        SUPABASE_URL +

        "/rest/v1/bookings?id=eq." +

        currentBookingId,

        {

          method: "PATCH",

          headers: {

            "apikey":
            SUPABASE_KEY,

            "Authorization":
            "Bearer " +
            SUPABASE_KEY,

            "Content-Type":
            "application/json",

            "Prefer":
            "return=minimal"

          },

          body:
          JSON.stringify({

            status:
            "accepted"

          })

        }

      );


    if (!response.ok) {

      var errorText =
        await response.text();


      workerBusy =
        false;


      acceptButton.disabled =
        false;

      rejectButton.disabled =
        false;


      status.innerText =

        "Could not accept booking:\n" +
        errorText;

      return;

    }


    /* =================================
       ACCEPTED
       ================================= */

    newJobAlert.style.display =
      "none";


    /*
       IMPORTANT:
       Hide both buttons after accepting.
    */

    acceptButton.style.display =
      "none";

    rejectButton.style.display =
      "none";


    /*
       Keep navigation available.
    */

    if (
      currentBooking &&
      currentBooking.latitude !== null &&
      currentBooking.latitude !== undefined &&
      currentBooking.latitude !== "" &&
      currentBooking.longitude !== null &&
      currentBooking.longitude !== undefined &&
      currentBooking.longitude !== ""
    ) {

      navigateButton.style.display =
        "block";

    }


    status.innerText =

      "✅ Job accepted!\n\n" +
      "📍 Tap Navigate to reach the customer.";

  }


  catch(error) {

    workerBusy =
      false;


    acceptButton.disabled =
      false;

    rejectButton.disabled =
      false;


    status.innerText =

      "Connection error:\n" +
      error.message;

  }

}


/* =================================
   REJECT JOB
   ================================= */

async function rejectJob() {

  if (!currentBookingId) {

    status.innerText =
      "No booking selected.";

    return;

  }


  acceptButton.disabled =
    true;

  rejectButton.disabled =
    true;


  try {

    var response =
      await fetch(

        SUPABASE_URL +

        "/rest/v1/bookings?id=eq." +

        currentBookingId,

        {

          method: "PATCH",

          headers: {

            "apikey":
            SUPABASE_KEY,

            "Authorization":
            "Bearer " +
            SUPABASE_KEY,

            "Content-Type":
            "application/json",

            "Prefer":
            "return=minimal"

          },

          body:
          JSON.stringify({

            status:
            "rejected"

          })

        }

      );


    if (!response.ok) {

      var errorText =
        await response.text();


      acceptButton.disabled =
        false;

      rejectButton.disabled =
        false;


      status.innerText =

        "Could not reject booking:\n" +
        errorText;

      return;

    }


    /* =================================
       REJECTED
       ================================= */

    status.innerText =

      "❌ Job rejected.\n\n" +
      "Waiting for another request...";


    currentBookingId =
      null;

    currentBooking =
      null;


    newJobAlert.style.display =
      "none";


    navigateButton.style.display =
      "none";


    acceptButton.style.display =
      "none";

    rejectButton.style.display =
      "none";


    waitingMessage.style.display =
      "block";


    acceptButton.disabled =
      false;

    rejectButton.disabled =
      false;


    workerBusy =
      false;


    /* Immediately check */

    setTimeout(
      loadBookings,
      500
    );

  }


  catch(error) {

    acceptButton.disabled =
      false;

    rejectButton.disabled =
      false;


    status.innerText =

      "Connection error:\n" +
      error.message;

  }

}


/* =================================
   NOTIFICATION PERMISSION
   ================================= */

async function requestNotificationPermission() {

  if (
    "Notification" in window &&
    Notification.permission === "default"
  ) {

    try {

      await Notification.requestPermission();

    }

    catch(error) {

      console.log(
        "Notification permission error:",
        error
      );

    }

  }

}


/* =================================
   START
   ================================= */

requestNotificationPermission();

loadBookings();


/* =================================
   CHECK FOR NEW BOOKINGS
   EVERY 5 SECONDS
   ================================= */

setInterval(
  loadBookings,
  5000
);

</script>

</body>
</html>
