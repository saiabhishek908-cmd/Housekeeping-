<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HouseKeep — Worker</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f6f8;
  color:#17191c;
}

.app{
  max-width:480px;
  margin:auto;
  min-height:100vh;
  background:white;
  padding:22px 18px 32px;
}

h1{
  margin:4px 0 5px;
  font-size:30px;
}

.tag{
  color:#666;
  margin-bottom:22px;
}

.card{
  border:1px solid #e1e3e6;
  border-radius:16px;
  padding:18px;
  margin:12px 0;
  background:white;
}

label{
  display:block;
  font-size:12px;
  font-weight:bold;
  color:#666;
  margin-bottom:7px;
}

input{
  width:100%;
  padding:14px;
  border:1px solid #d5d7db;
  border-radius:10px;
  font-size:16px;
}

button{
  width:100%;
  border:0;
  border-radius:12px;
  padding:15px;
  font-size:16px;
  font-weight:bold;
  background:#111;
  color:white;
  margin-top:10px;
}

button.secondary{
  background:#e9eaed;
  color:#111;
}

button.danger{
  background:#b42318;
  color:white;
}

.small{
  font-size:13px;
  color:#777;
  margin-top:7px;
  line-height:1.45;
}

.job-title{
  font-size:20px;
  font-weight:bold;
  margin-bottom:14px;
}

.job-row{
  margin:9px 0;
  line-height:1.45;
}

.job-row strong{
  display:inline-block;
  min-width:90px;
}

.status{
  padding:12px;
  border-radius:10px;
  margin:12px 0;
  background:#eef7ee;
  color:#176b2c;
  font-size:14px;
}

.error{
  padding:12px;
  border-radius:10px;
  margin:12px 0;
  background:#fff0f0;
  color:#a40000;
  font-size:14px;
}

.hidden{
  display:none;
}

.contact{
  background:#f1f7ff;
  border:1px solid #cfe1f7;
  border-radius:12px;
  padding:15px;
  margin-top:15px;
}

.contact-title{
  font-weight:bold;
  margin-bottom:8px;
}

.loading{
  text-align:center;
  padding:25px 10px;
  color:#777;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.topbar button{
  width:auto;
  padding:9px 13px;
  margin:0;
  font-size:13px;
}

.no-jobs{
  text-align:center;
  padding:30px 15px;
  color:#777;
  border:1px dashed #ccc;
  border-radius:14px;
}

.login-box{
  margin-top:35px;
}
</style>
</head>

<body>

<div class="app">

  <!-- LOGIN SCREEN -->

  <div id="loginScreen">

    <h1>HouseKeep</h1>

    <div class="tag">
      Worker Dashboard
    </div>

    <div class="card login-box">

      <label>EMAIL</label>
      <input
        id="email"
        type="email"
        placeholder="Enter your email"
      >

      <label style="margin-top:15px;">PASSWORD</label>
      <input
        id="password"
        type="password"
        placeholder="Enter your password"
      >

      <button onclick="login()">
        Login
      </button>

      <div id="loginMessage"></div>

    </div>

  </div>


  <!-- WORKER DASHBOARD -->

  <div id="dashboard" class="hidden">

    <div class="topbar">

      <div>
        <h1>HouseKeep</h1>
        <div class="small">
          Available bookings
        </div>
      </div>

      <button
        class="secondary"
        onclick="logout()"
      >
        Logout
      </button>

    </div>

    <div id="dashboardMessage"></div>

    <div id="jobsContainer">

      <div class="loading">
        Loading bookings...
      </div>

    </div>

  </div>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://yrbhxouodsfsxryaduc9.supabase.co";

const SUPABASE_KEY =
"sb_publishable_TiNwYlPb2eHLfyhurkKLcg_0yKa6n4x";


const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


let currentUser = null;
let currentBookingId = null;
let workerBusy = false;


/* --------------------------------------------------
   LOGIN
-------------------------------------------------- */

async function login(){

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const message =
    document.getElementById("loginMessage");


  if(!email || !password){

    message.innerHTML =
      '<div class="error">Please enter your email and password.</div>';

    return;
  }


  message.innerHTML =
    '<div class="status">Logging in...</div>';


  const {
    data,
    error
  } =
    await supabaseClient.auth.signInWithPassword({
      email: email,
      password: password
    });


  if(error){

    console.error(error);

    message.innerHTML =
      '<div class="error">' +
      error.message +
      '</div>';

    return;
  }


  currentUser = data.user;

  showDashboard();

}


/* --------------------------------------------------
   SHOW DASHBOARD
-------------------------------------------------- */

function showDashboard(){

  document
    .getElementById("loginScreen")
    .classList.add("hidden");

  document
    .getElementById("dashboard")
    .classList.remove("hidden");

  loadBookings();

}


/* --------------------------------------------------
   LOAD AVAILABLE BOOKINGS
-------------------------------------------------- */

async function loadBookings(){

  if(!currentUser){
    return;
  }


  const container =
    document.getElementById("jobsContainer");


  try{

    const {
      data,
      error
    } =
    await supabaseClient.rpc(
      "get_available_bookings_for_worker"
    );


    if(error){

      console.error(
        "Load bookings error:",
        error
      );

      container.innerHTML =
        '<div class="error">' +
        "Unable to load bookings. " +
        error.message +
        '</div>';

      return;
    }


    const bookings = data || [];


    if(bookings.length === 0){

      container.innerHTML =
        `
        <div class="no-jobs">

          <div style="font-size:18px;font-weight:bold;">
            No available bookings
          </div>

          <div class="small">
            New bookings will appear here automatically.
          </div>

        </div>
        `;

      return;
    }


    container.innerHTML = "";


    bookings.forEach(function(booking){

      const card =
        document.createElement("div");

      card.className = "card";


      const workerText =
        booking.workers === 1
        ? "1 housekeeper"
        : booking.workers + " housekeepers";


      card.innerHTML =
        `
        <div class="job-title">
          ${escapeHtml(booking.service || "Housekeeping")}
        </div>

        <div class="job-row">
          <strong>Location:</strong>
          ${escapeHtml(booking.location || "Not provided")}
        </div>

        <div class="job-row">
          <strong>Duration:</strong>
          ${escapeHtml(String(booking.hours || ""))} hour(s)
        </div>

        <div class="job-row">
          <strong>Workers:</strong>
          ${escapeHtml(workerText)}
        </div>

        <div class="job-row">
          <strong>Price:</strong>
          ₹${escapeHtml(String(booking.price || "0"))}
        </div>

        <div class="job-row">
          <strong>Status:</strong>
          ${escapeHtml(booking.status || "pending")}
        </div>

        <button
          onclick="openJob(${booking.id})"
        >
          View Booking
        </button>
        `;


      container.appendChild(card);

    });


  }catch(error){

    console.error(error);

    container.innerHTML =
      '<div class="error">Something went wrong while loading bookings.</div>';

  }

}


/* --------------------------------------------------
   OPEN BOOKING
-------------------------------------------------- */

async function openJob(bookingId){

  currentBookingId = bookingId;

  const container =
    document.getElementById("jobsContainer");


  container.innerHTML =
    '<div class="loading">Loading booking...</div>';


  try{

    const {
      data,
      error
    } =
    await supabaseClient.rpc(
      "get_available_bookings_for_worker"
    );


    if(error){
      throw error;
    }


    const booking =
      (data || []).find(
        item => Number(item.id) === Number(bookingId)
      );


    if(!booking){

      container.innerHTML =
        `
        <div class="error">
          This booking is no longer available.
        </div>

        <button
          class="secondary"
          onclick="loadBookings()"
        >
          Back
        </button>
        `;

      return;
    }


    const workerText =
      booking.workers === 1
      ? "1 housekeeper"
      : booking.workers + " housekeepers";


    container.innerHTML =
      `
      <div class="card">

        <div class="job-title">
          ${escapeHtml(booking.service || "Housekeeping")}
        </div>

        <div class="job-row">
          <strong>Location:</strong>
          ${escapeHtml(booking.location || "Not provided")}
        </div>

        <div class="job-row">
          <strong>Duration:</strong>
          ${escapeHtml(String(booking.hours || ""))} hour(s)
        </div>

        <div class="job-row">
          <strong>Workers:</strong>
          ${escapeHtml(workerText)}
        </div>

        <div class="job-row">
          <strong>Price:</strong>
          ₹${escapeHtml(String(booking.price || "0"))}
        </div>

        <div class="job-row">
          <strong>Status:</strong>
          ${escapeHtml(booking.status || "pending")}
        </div>

        ${
          booking.latitude !== null &&
          booking.longitude !== null
          ?
          `
          <button
            class="secondary"
            onclick="openNavigation(
              ${Number(booking.latitude)},
              ${Number(booking.longitude)}
            )"
          >
            Open Navigation
          </button>
          `
          :
          ""
        }

        <button
          onclick="acceptJob(${booking.id})"
          id="acceptButton"
        >
          Accept Booking
        </button>

        <button
          class="secondary"
          onclick="loadBookings()"
        >
          Back
        </button>

        <div id="jobMessage"></div>

        <div id="contactBox"></div>

      </div>
      `;


  }catch(error){

    console.error(error);

    container.innerHTML =
      `
      <div class="error">
        Unable to load booking.
      </div>

      <button
        class="secondary"
        onclick="loadBookings()"
      >
        Back
      </button>
      `;

  }

}


/* --------------------------------------------------
   ACCEPT BOOKING
-------------------------------------------------- */

async function acceptJob(bookingId){

  if(workerBusy){
    return;
  }


  workerBusy = true;


  const button =
    document.getElementById("acceptButton");

  const message =
    document.getElementById("jobMessage");


  if(button){

    button.disabled = true;

    button.textContent =
      "Accepting...";

  }


  try{

    const {
      data,
      error
    } =
    await supabaseClient.rpc(
      "accept_booking_as_worker",
      {
        p_booking_id: bookingId
      }
    );


    if(error){

      throw error;

    }


    const result =
      data && data.length
      ? data[0]
      : null;


    if(!result){

      throw new Error(
        "The server did not return the booking status."
      );

    }


    message.innerHTML =
      `
      <div class="status">

        Booking accepted.

        <br><br>

        Workers assigned:
        <strong>
          ${result.workers_accepted}
          /
          ${result.workers_requested}
        </strong>

        <br>

        Status:
        <strong>
          ${escapeHtml(result.booking_status)}
        </strong>

      </div>
      `;


    /*
      Now that THIS worker has accepted,
      request customer contact through the
      secure worker-only RPC.
    */

    await loadCustomerContact(bookingId);


    if(button){

      button.textContent =
        "Booking Accepted";

      button.disabled = true;

    }


  }catch(error){

    console.error(
      "Accept booking error:",
      error
    );


    message.innerHTML =
      `
      <div class="error">
        ${escapeHtml(error.message || "Unable to accept booking.")}
      </div>
      `;


    if(button){

      button.disabled = false;

      button.textContent =
        "Accept Booking";

    }

  }finally{

    workerBusy = false;

  }

}


/* --------------------------------------------------
   CUSTOMER CONTACT
-------------------------------------------------- */

async function loadCustomerContact(bookingId){

  const contactBox =
    document.getElementById("contactBox");


  if(!contactBox){
    return;
  }


  const {
    data,
    error
  } =
  await supabaseClient.rpc(
    "get_customer_contact_for_worker",
    {
      p_booking_id: bookingId
    }
  );


  if(error){

    console.error(
      "Contact error:",
      error
    );

    contactBox.innerHTML =
      `
      <div class="error">
        Booking accepted, but customer contact
        could not be loaded yet.
      </div>
      `;

    return;
  }


  if(!data || data.length === 0){

    contactBox.innerHTML =
      `
      <div class="error">
        Customer contact is not available.
      </div>
      `;

    return;
  }


  const customer =
    data[0];


  contactBox.innerHTML =
    `
    <div class="contact">

      <div class="contact-title">
        Customer Contact
      </div>

      <div class="job-row">
        <strong>Name:</strong>
        ${escapeHtml(customer.customer_name || "Customer")}
      </div>

      <div class="job-row">
        <strong>Phone:</strong>
        ${escapeHtml(customer.customer_phone || "Not provided")}
      </div>

      ${
        customer.customer_phone
        ?
        `
        <button
          onclick="callCustomer('${encodeURIComponent(customer.customer_phone)}')"
        >
          Call Customer
        </button>
        `
        :
        ""
      }

    </div>
    `;

}


/* --------------------------------------------------
   CALL CUSTOMER
-------------------------------------------------- */

function callCustomer(phone){

  const decoded =
    decodeURIComponent(phone);

  window.location.href =
    "tel:" + decoded;

}


/* --------------------------------------------------
   NAVIGATION
-------------------------------------------------- */

function openNavigation(latitude, longitude){

  window.open(
    "https://www.google.com/maps/dir/?api=1&destination=" +
    latitude +
    "," +
    longitude,
    "_blank"
  );

}


/* --------------------------------------------------
   LOGOUT
-------------------------------------------------- */

async function logout(){

  await supabaseClient.auth.signOut();

  currentUser = null;

  document
    .getElementById("dashboard")
    .classList.add("hidden");

  document
    .getElementById("loginScreen")
    .classList.remove("hidden");

  document
    .getElementById("password")
    .value = "";

}


/* --------------------------------------------------
   CHECK EXISTING SESSION
-------------------------------------------------- */

async function checkSession(){

  const {
    data
  } =
  await supabaseClient.auth.getSession();


  if(
    data &&
    data.session &&
    data.session.user
  ){

    currentUser =
      data.session.user;

    showDashboard();

  }

}


/* --------------------------------------------------
   AUTO REFRESH
-------------------------------------------------- */

setInterval(
  function(){

    if(
      currentUser &&
      !currentBookingId
    ){

      loadBookings();

    }

  },
  5000
);


/* --------------------------------------------------
   ESCAPE HTML
-------------------------------------------------- */

function escapeHtml(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* --------------------------------------------------
   START
-------------------------------------------------- */

checkSession();

</script>

</body>
</html>
