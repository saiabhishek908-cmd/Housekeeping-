<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Housekeeping Worker</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      margin: auto;
    }

    h1 {
      text-align: center;
    }

    .card {
      background: white;
      padding: 18px;
      border-radius: 12px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      background: #222;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    .job {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 14px;
      margin-top: 12px;
    }

    .hidden {
      display: none;
    }

    .status {
      padding: 10px;
      border-radius: 8px;
      background: #f0f0f0;
      margin-top: 10px;
    }

    .success {
      background: #e8f7e8;
    }

    .error {
      background: #ffe8e8;
      color: #a00000;
      white-space: pre-wrap;
    }

    .small {
      font-size: 13px;
      color: #666;
    }

    a.call-button {
      display: block;
      text-align: center;
      background: #198754;
      color: white;
      text-decoration: none;
      padding: 12px;
      border-radius: 8px;
      margin-top: 10px;
    }

    a.map-button {
      display: block;
      text-align: center;
      background: #0d6efd;
      color: white;
      text-decoration: none;
      padding: 12px;
      border-radius: 8px;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Worker App</h1>

  <!-- LOGIN -->
  <div id="loginSection" class="card">

    <h2>Worker Login</h2>

    <input
      type="email"
      id="email"
      placeholder="Email"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
    >

    <button onclick="login()">
      Login
    </button>

    <div id="loginMessage" class="status"></div>

  </div>


  <!-- WORKER APP -->
  <div id="appSection" class="hidden">

    <div class="card">

      <h2>Available Jobs</h2>

      <div id="workerInfo" class="small"></div>

      <button onclick="loadBookings()">
        Refresh Jobs
      </button>

      <button onclick="logout()">
        Logout
      </button>

    </div>


    <div class="card">

      <div id="jobs">
        Loading jobs...
      </div>

    </div>


    <!-- SELECTED JOB -->
    <div id="jobDetailsSection" class="card hidden">

      <h2>Job Details</h2>

      <div id="jobDetails"></div>

    </div>

  </div>

</div>


<script>

  /* =========================
     SUPABASE
  ========================= */

  const SUPABASE_URL =
    "https://yrbhxouodsfsxryaducn.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_TiNwYlPb2eHLfyhurkKLcg_0yKa6n4x";

  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  let currentUser = null;
  let currentBooking = null;
  let workerBusy = false;


  /* =========================
     LOGIN
  ========================= */

  async function login() {

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    const message =
      document.getElementById("loginMessage");

    message.className = "status";
    message.textContent = "Logging in...";

    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

    if (error) {

      message.className = "status error";

      message.textContent =
        "Login failed:\n\n" +
        "Message: " + error.message +
        "\n\nCode: " + (error.code || "none");

      return;
    }

    currentUser = data.user;

    showWorkerApp();

  }


  /* =========================
     SESSION CHECK
  ========================= */

  async function checkSession() {

    const { data, error } =
      await supabaseClient.auth.getSession();

    if (error) {
      console.log(error);
      return;
    }

    if (data.session && data.session.user) {

      currentUser =
        data.session.user;

      showWorkerApp();

    } else {

      showLogin();

    }

  }


  /* =========================
     SHOW LOGIN
  ========================= */

  function showLogin() {

    document
      .getElementById("loginSection")
      .classList.remove("hidden");

    document
      .getElementById("appSection")
      .classList.add("hidden");

  }


  /* =========================
     SHOW WORKER APP
  ========================= */

  function showWorkerApp() {

    document
      .getElementById("loginSection")
      .classList.add("hidden");

    document
      .getElementById("appSection")
      .classList.remove("hidden");

    document
      .getElementById("workerInfo")
      .textContent =
        "Logged in worker: " +
        currentUser.email;

    loadBookings();

  }


  /* =========================
     LOAD AVAILABLE BOOKINGS
  ========================= */

  async function loadBookings() {

    const jobsDiv =
      document.getElementById("jobs");

    jobsDiv.innerHTML =
      "Loading jobs...";


    const { data, error } =
      await supabaseClient.rpc(
        "get_available_bookings_for_worker"
      );


    if (error) {

      jobsDiv.innerHTML =
        '<div class="status error">' +
        "Could not load jobs.\n\n" +
        "Message: " + error.message +
        "\n\nCode: " + (error.code || "none") +
        "\n\nDetails: " + (error.details || "none") +
        "\n\nHint: " + (error.hint || "none") +
        "</div>";

      return;
    }


    if (!data || data.length === 0) {

      jobsDiv.innerHTML =
        '<div class="status">' +
        "No available jobs right now." +
        "</div>";

      return;
    }


    jobsDiv.innerHTML = "";


    data.forEach(function(job) {

      const div =
        document.createElement("div");

      div.className = "job";


      div.innerHTML = `

        <strong>${escapeHtml(job.service || "Cleaning")}</strong>

        <br><br>

        <strong>Location:</strong>
        ${escapeHtml(job.location || "Not provided")}

        <br>

        <strong>Duration:</strong>
        ${job.hours || 0} hour(s)

        <br>

        <strong>Workers required:</strong>
        ${job.workers || 0}

        <br>

        <strong>Price:</strong>
        ₹${escapeHtml(String(job.price || 0))}

        <br>

        <strong>Status:</strong>
        ${escapeHtml(job.status || "")}

        <br><br>

        <button onclick="openJob(${job.id})">
          View Job
        </button>

      `;

      jobsDiv.appendChild(div);

    });

  }


  /* =========================
     OPEN JOB
  ========================= */

  async function openJob(bookingId) {

    const { data, error } =
      await supabaseClient.rpc(
        "get_available_bookings_for_worker"
      );


    if (error) {

      showJobError(error);

      return;
    }


    const job =
      data.find(
        function(item) {
          return String(item.id) === String(bookingId);
        }
      );


    if (!job) {

      document
        .getElementById("jobDetailsSection")
        .classList.remove("hidden");

      document
        .getElementById("jobDetails")
        .innerHTML =
        '<div class="status error">' +
        "This booking is no longer available." +
        "</div>";

      return;
    }


    currentBooking = job;


    document
      .getElementById("jobDetailsSection")
      .classList.remove("hidden");


    document
      .getElementById("jobDetails")
      .innerHTML = `

        <strong>Service:</strong>
        ${escapeHtml(job.service || "")}

        <br><br>

        <strong>Location:</strong>
        ${escapeHtml(job.location || "")}

        <br><br>

        <strong>Duration:</strong>
        ${job.hours || 0} hour(s)

        <br><br>

        <strong>Housekeepers requested:</strong>
        ${job.workers || 0}

        <br><br>

        <strong>Price:</strong>
        ₹${escapeHtml(String(job.price || 0))}

        <br><br>

        <strong>Status:</strong>
        ${escapeHtml(job.status || "")}

        <br><br>

        ${
          job.latitude && job.longitude
          ?
          `<a
            class="map-button"
            target="_blank"
            href="https://www.google.com/maps/dir/?api=1&destination=${job.latitude},${job.longitude}">
            Open Navigation
          </a>`
          :
          ""
        }

        <button
          id="acceptButton"
          onclick="acceptJob()">
          Accept Job
        </button>

        <div id="acceptMessage"></div>

      `;

  }


  /* =========================
     ACCEPT JOB
  ========================= */

  async function acceptJob() {

    if (!currentBooking) {

      alert("No booking selected.");

      return;
    }


    if (workerBusy) {

      return;
    }


    workerBusy = true;


    const button =
      document.getElementById("acceptButton");

    const message =
      document.getElementById("acceptMessage");


    if (button) {

      button.disabled = true;
      button.textContent = "Accepting...";

    }


    message.className = "status";
    message.textContent =
      "Sending acceptance to Supabase...";


    console.log(
      "Attempting acceptance:",
      currentBooking.id
    );


    /*
      IMPORTANT:

      We are NOT directly updating bookings.

      The SECURITY DEFINER function handles:
      - authenticated worker check
      - duplicate worker check
      - worker limit
      - booking lock
      - booking_workers insert
      - booking status update
    */

    const { data, error } =
      await supabaseClient.rpc(
        "accept_booking_as_worker",
        {
          p_booking_id:
            currentBooking.id
        }
      );


    console.log(
      "Accept RPC data:",
      data
    );

    console.log(
      "Accept RPC error:",
      error
    );


    if (error) {

      /*
        SHOW THE REAL SUPABASE ERROR.
        This is what we need if something
        is still wrong.
      */

      message.className =
        "status error";

      message.textContent =
        "ACCEPT FAILED\n\n" +
        "Message: " +
        (error.message || "none") +
        "\n\n" +
        "Code: " +
        (error.code || "none") +
        "\n\n" +
        "Details: " +
        (error.details || "none") +
        "\n\n" +
        "Hint: " +
        (error.hint || "none");


      if (button) {

        button.disabled = false;
        button.textContent = "Try Again";

      }


      workerBusy = false;

      return;
    }


    if (!data || data.length === 0) {

      message.className =
        "status error";

      message.textContent =
        "Supabase accepted the request but returned no result.";

      if (button) {

        button.disabled = false;
        button.textContent = "Try Again";

      }

      workerBusy = false;

      return;
    }


    const result =
      Array.isArray(data)
      ? data[0]
      : data;


    const requested =
      result.workers_requested;

    const accepted =
      result.workers_accepted;

    const status =
      result.booking_status;


    message.className =
      "status success";

    message.textContent =
      "Booking accepted successfully.\n\n" +
      "Workers assigned: " +
      accepted +
      " / " +
      requested +
      "\n\n" +
      "Status: " +
      status;


    /*
      Now retrieve this worker's customer
      contact through the secure RPC.
    */

    await loadCustomerContact(
      currentBooking.id
    );


    /*
      Refresh the available job list.
      The accepted worker should no longer
      see this booking.
    */

    await loadBookings();

    workerBusy = false;

  }


  /* =========================
     CUSTOMER CONTACT
  ========================= */

  async function loadCustomerContact(
    bookingId
  ) {

    const { data, error } =
      await supabaseClient.rpc(
        "get_customer_contact_for_worker",
        {
          p_booking_id:
            bookingId
        }
      );


    console.log(
      "Customer contact:",
      data
    );

    console.log(
      "Customer contact error:",
      error
    );


    if (error) {

      const message =
        document.getElementById(
          "acceptMessage"
        );

      message.className =
        "status error";

      message.textContent +=
        "\n\nCustomer contact could not be loaded.\n" +
        error.message;

      return;
    }


    if (!data || data.length === 0) {

      return;
    }


    const contact =
      Array.isArray(data)
      ? data[0]
      : data;


    const details =
      document.getElementById(
        "jobDetails"
      );


    details.innerHTML += `

      <hr>

      <h3>Customer Contact</h3>

      <strong>Name:</strong>
      ${escapeHtml(contact.customer_name || "")}

      <br><br>

      <strong>Phone:</strong>
      ${escapeHtml(contact.customer_phone || "")}

      <a
        class="call-button"
        href="tel:${escapeHtml(contact.customer_phone || "")}">
        Call Customer
      </a>

    `;

  }


  /* =========================
     ERROR DISPLAY
  ========================= */

  function showJobError(error) {

    document
      .getElementById("jobDetailsSection")
      .classList.remove("hidden");

    document
      .getElementById("jobDetails")
      .innerHTML =
      '<div class="status error">' +
      "ERROR\n\n" +
      "Message: " +
      (error.message || "none") +
      "\n\nCode: " +
      (error.code || "none") +
      "\n\nDetails: " +
      (error.details || "none") +
      "\n\nHint: " +
      (error.hint || "none") +
      "</div>";

  }


  /* =========================
     LOGOUT
  ========================= */

  async function logout() {

    await supabaseClient.auth.signOut();

    currentUser = null;
    currentBooking = null;

    showLogin();

  }


  /* =========================
     HTML ESCAPE
  ========================= */

  function escapeHtml(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /* =========================
     AUTO SESSION
  ========================= */

  checkSession();


  /* =========================
     AUTO REFRESH
  ========================= */

  setInterval(
    function() {

      if (currentUser) {

        loadBookings();

      }

    },
    5000
  );

</script>

</body>
</html>
