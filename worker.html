<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HouseKeep Worker</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f5f5;
    }

    .app {
      max-width: 480px;
      margin: auto;
      background: white;
      min-height: 100vh;
      padding: 25px;
      box-sizing: border-box;
    }

    h1 {
      margin-bottom: 5px;
    }

    p {
      color: #666;
    }

    .booking {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 18px;
      margin-top: 20px;
    }

    .status {
      font-weight: bold;
      margin-top: 15px;
      white-space: pre-line;
    }

    button,
    .navigate {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
      margin-top: 10px;
      box-sizing: border-box;
    }

    .accept {
      background: #111;
      color: white;
    }

    .reject {
      background: #eee;
      color: #111;
    }

    .navigate {
      background: #1a73e8;
      color: white;
      text-decoration: none;
      display: block;
      text-align: center;
    }

    .coordinates {
      margin-top: 12px;
      padding: 12px;
      background: #f5f5f5;
      border-radius: 8px;
      font-size: 14px;
      color: #555;
    }

    .loading {
      color: #666;
    }
  </style>
</head>

<body>

<div class="app">

  <h1>HouseKeep Worker</h1>

  <p>New cleaning request</p>

  <div class="booking">

    <h2>New Booking</h2>

    <div id="bookingDetails" class="loading">
      Loading booking...
    </div>

    <div id="coordinates"></div>

    <a
      id="navigateButton"
      class="navigate"
      href="#"
      target="_blank"
      style="display: none;"
    >
      📍 Navigate to Customer
    </a>

    <button
      class="accept"
      onclick="acceptJob()"
    >
      Accept Job
    </button>

    <button
      class="reject"
      onclick="rejectJob()"
    >
      Reject
    </button>

    <div
      id="status"
      class="status"
    ></div>

  </div>

</div>


<script>

/* =================================
   SUPABASE
   ================================= */

var SUPABASE_URL =
  "https://yrbhxouodsfsxryaducn.supabase.co";

var SUPABASE_KEY =
  "sb_publishable_TiNwYlPb2eHLfyhurkKLcg_0yKa6n4x";


/* =================================
   CURRENT BOOKING
   ================================= */

var currentBookingId = null;


/* =================================
   LOAD PENDING BOOKING
   ================================= */

async function loadBookings() {

  var bookingDetails =
    document.getElementById(
      "bookingDetails"
    );

  var coordinates =
    document.getElementById(
      "coordinates"
    );

  var navigateButton =
    document.getElementById(
      "navigateButton"
    );


  try {

    var response =
      await fetch(

        SUPABASE_URL +

        "/rest/v1/bookings" +

        "?select=id,location,service,hours,workers,price,status,latitude,longitude" +

        "&status=eq.pending" +

        "&order=created_at.desc",

        {

          headers: {

            "apikey":
            SUPABASE_KEY,

            "Authorization":
            "Bearer " +
            SUPABASE_KEY

          }

        }

      );


    /* =================================
       CHECK RESPONSE
       ================================= */

    if (!response.ok) {

      var errorText =
        await response.text();

      bookingDetails.innerText =
        "Could not load bookings.";

      document.getElementById(
        "status"
      ).innerText =
        errorText;

      return;
    }


    /* =================================
       GET BOOKINGS
       ================================= */

    var bookings =
      await response.json();


    if (
      !bookings ||
      bookings.length === 0
    ) {

      bookingDetails.innerText =
        "No new bookings.";

      coordinates.innerHTML =
        "";

      navigateButton.style.display =
        "none";

      return;
    }


    /* =================================
       GET NEWEST BOOKING
       ================================= */

    
var booking =
  bookings[0];

console.log("WORKER BOOKING:", booking);
console.log("LATITUDE:", booking.latitude);
console.log("LONGITUDE:", booking.longitude);

    currentBookingId =
      booking.id;


    /* =================================
       DISPLAY BOOKING
       ================================= */

    bookingDetails.innerHTML =

      "<strong>Location:</strong> " +
      booking.location +
      "<br><br>" +

      "<strong>Service:</strong> " +
      booking.service +
      "<br><br>" +

      "<strong>Duration:</strong> " +
      booking.hours +
      " hour(s)" +
      "<br><br>" +

      "<strong>Housekeepers:</strong> " +
      booking.workers +
      "<br><br>" +

      "<strong>Price:</strong> " +
      booking.price;


    /* =================================
       CHECK GPS
       ================================= */

    var hasLatitude =
      booking.latitude !== null &&
      booking.latitude !== undefined &&
      booking.latitude !== "";


    var hasLongitude =
      booking.longitude !== null &&
      booking.longitude !== undefined &&
      booking.longitude !== "";


    if (
      hasLatitude &&
      hasLongitude
    ) {

      /* ================================
         SHOW GPS
         ================================ */

      coordinates.innerHTML =

        "<div class='coordinates'>" +

        "<strong>Customer GPS:</strong><br>" +

        booking.latitude +
        ", " +
        booking.longitude +

        "</div>";


      /* ================================
         CREATE GOOGLE MAPS LINK
         ================================ */

      var mapsUrl =

        "https://www.google.com/maps/dir/?api=1&destination=" +

        encodeURIComponent(
          booking.latitude +
          "," +
          booking.longitude
        );


      navigateButton.href =
        mapsUrl;


      navigateButton.style.display =
        "block";

    }


    else {

      coordinates.innerHTML =

        "<div class='coordinates'>" +

        "Customer GPS location not available." +

        "</div>";


      navigateButton.style.display =
        "none";

    }

  }


  catch(error) {

    bookingDetails.innerText =
      "Connection error.";

    document.getElementById(
      "status"
    ).innerText =
      error.message;

  }

}


/* =================================
   ACCEPT JOB
   ================================= */

async function acceptJob() {

  if (!currentBookingId) {

    document.getElementById(
      "status"
    ).innerText =
      "No booking selected.";

    return;
  }


  try {

    var response =
      await fetch(

        SUPABASE_URL +

        "/rest/v1/bookings?id=eq." +

        currentBookingId,

        {

          method: "PATCH",

          headers: {

            "apikey":
            SUPABASE_KEY,

            "Authorization":
            "Bearer " +
            SUPABASE_KEY,

            "Content-Type":
            "application/json",

            "Prefer":
            "return=minimal"

          },

          body:
          JSON.stringify({

            status:
            "accepted"

          })

        }

      );


    if (!response.ok) {

      var errorText =
        await response.text();

      document.getElementById(
        "status"
      ).innerText =

        "Could not accept booking:\n" +
        errorText;

      return;
    }


    document.getElementById(
      "status"
    ).innerText =

      "Job accepted!\n" +
      "Tap Navigate to reach the customer.";

  }


  catch(error) {

    document.getElementById(
      "status"
    ).innerText =

      "Connection error:\n" +
      error.message;

  }

}


/* =================================
   REJECT JOB
   ================================= */

async function rejectJob() {

  if (!currentBookingId) {

    document.getElementById(
      "status"
    ).innerText =
      "No booking selected.";

    return;
  }


  try {

    var response =
      await fetch(

        SUPABASE_URL +

        "/rest/v1/bookings?id=eq." +

        currentBookingId,

        {

          method: "PATCH",

          headers: {

            "apikey":
            SUPABASE_KEY,

            "Authorization":
            "Bearer " +
            SUPABASE_KEY,

            "Content-Type":
            "application/json",

            "Prefer":
            "return=minimal"

          },

          body:
          JSON.stringify({

            status:
            "rejected"

          })

        }

      );


    if (!response.ok) {

      var errorText =
        await response.text();

      document.getElementById(
        "status"
      ).innerText =

        "Could not reject booking:\n" +
        errorText;

      return;
    }


    document.getElementById(
      "status"
    ).innerText =

      "Job rejected.";

  }


  catch(error) {

    document.getElementById(
      "status"
    ).innerText =

      "Connection error:\n" +
      error.message;

  }

}


/* =================================
   START
   ================================= */

loadBookings();

</script>

</body>
</html>
